<script src="../lib/utils/syntax-sugar/ifel.js"></script>

<script src="ml.js"></script>
<script>
window.addEventListener('DOMContentLoaded', (event) => {
    const a = new Assertion()
    const bb = new BlackBox(a)
    // プロパティ存在確認
    //'el,mkFrg,mkTxt,mkCmt,mkCdt,mkProcInst,mkAttr,root,add,addRoot,get,gets,set,del,getPath,getX,getXs,setX,delX,on,off'.split(',').map(k=>a.t(()=>!!ml[k]))
    'el,root,add,addRoot,get,gets,set,del,getPath,getX,getXs,setX,delX,on,off'.split(',').map(k=>a.t(()=>!!ml[k]))
    a.t(Type.hasGetter(ml,'onStart'))
    a.t(Type.hasSetter(ml,'onStart'))
    a.t(Type.hasGetter(ml,'onEnd'))
    a.t(Type.hasSetter(ml,'onEnd'))
    a.t(Type.hasGetter(ml,'node'))
    a.f(Type.hasSetter(ml,'node'))

    // el
    console.log(ml.el)
    console.log(ml.el())
    console.log(ml.el('http://www.w3.org/2000/svg'))
    // 名前空間あり（SVG）
    ;(function(){
        const {svg, circle} = ml.el('http://www.w3.org/2000/svg');
        const S = svg({id:'test-svg',viewBox:'0, 5, 160, 100'}, circle({cx:10, cy:20, r:30, fill:'red'}))
        document.body.append(S)
        //document.body.append(svg({id:'test-svg',viewBox:'0, 5, 160, 100'}, circle({cx:10, cy:10, r:10, fill:'red'})))
        const s = document.querySelector('#test-svg')
        a.t(S===s)
        a.t(S===ml.get('#test-svg'))
        a.t('svg'===s.tagName)
        a.t(0===s.viewBox.baseVal.x)
        a.t(5===s.viewBox.baseVal.y)
        a.t(160===s.viewBox.baseVal.width)
        a.t(100===s.viewBox.baseVal.height)
        const c = s.get('circle')
        console.log(c.cx)
        a.t(10===c.cx.baseVal.value)
        a.t(20===c.cy.baseVal.value)
        a.t(30===c.r.baseVal.value)
    })();
    // 名前空間なし（HTML）
    ;(function(){
        const span = ml.el.span()
        a.t('SPAN'===span.tagName)
        a.t(HTMLSpanElement===span.constructor)
        const i = ml.el.i({id:'i-id'})
        a.t('I'===i.tagName)
        a.t(HTMLElement===i.constructor)
        a.t('i-id'===i.id)
        a.t(null===ml.get('#i-id'))
        ml.addRoot(i)
        a.t(i===ml.get('#i-id'))
        i.del()
        a.t(null===ml.get('#i-id'))
        const b = ml.el.b({id:'b-id', class:'a b-c', style:'color:red; writing-mode:vertical-rl;', dataSomeKey:'some-data'}, 'bold-text-node')
        a.t('b-id'===b.attr.id)
        a.t('a b-c'===b.attr.class)
        a.t('color: red; writing-mode: vertical-rl;'===b.attr.style) // space等が勝手に調整されてしまう
        a.t('some-data'===b.attr.dataSomeKey)
        a.t('red'===b.style.color)
        a.t('vertical-rl'===b.style.writingMode)
        a.t('some-data'===b.data.someKey)
        a.t('bold-text-node'===b.text)
        a.t('<b id="b-id" class="a b-c" data-some-key="some-data" style="color: red; writing-mode: vertical-rl;">bold-text-node</b>'===b.html)
        //a.t(null===ml.root.get('p'))
    })();

    // node
    ;(function(){
        //const el = ml.el.p()
        'frag,text,comment,cdata,proc,attr,el'.split(',').map(k=>a.t(()=>!!ml.node[k]))
        a.t(ml.root.N.typeObj.documentFragment === ml.node.frag().N.type)
        a.t(ml.root.N.typeObj.text === ml.node.text().N.type)
        a.t(ml.root.N.typeObj.comment === ml.node.comment().N.type)
        //a.t(ml.root.N.typeObj.cdata === ml.node.cdata().N.type)
        a.e(DOMException, `Failed to execute 'createCDATASection' on 'Document': This operation is not supported for HTML documents.`, ()=>ml.node.cdata().N.type)
        a.t(ml.root.N.typeObj.processingInstruction === ml.node.proc().N.type)
        a.t(ml.root.N.typeObj.attr === ml.node.attr().N.type)
        a.t(ml.root.N.typeObj.element === ml.node.el.p().N.type)

        const frag = ml.node.frag(ml.el.span('A'), ml.el.span('B'))
        console.log(frag)
        const p = ml.el.p(frag)
        console.log(p)
        ml.root.add(p)
        const spans = p.gets('span')
        console.log(p)
        console.log(spans.length)
        console.log(spans.length, 'A'===spans[0].textContent, 'B'===spans[1].textContent)
        //console.log(2===spans.length, 'A'===spans[0].N.text, 'B'===spans[1].N.text)
        a.t(2===p.gets('span').length &&'A'===spans[0].text && 'B'===spans[1].text)
        p.del()
//        console.log(p, ml.root.get('p'))
//        a.t(null===ml.root.get('p'))
    })();

    // root
    ;(function(){
        a.t(document.querySelector(':root')===ml.root)
    })();

    // add
    ;(function(){
        const p = ml.el.p()
        ml.add(p, ml.el.span('A'))
        a.t(1===p.children.length && 'A'===p.children[0].text)
        ml.add(p, ml.el.span('B'), ml.el.span('C'))
        a.t(3===p.children.length && 'A'===p.children[0].text && 'B'===p.children[1].text && 'C'===p.children[2].text)

        p.add(ml.el.span('D'), ml.el.span('E'))
        a.t(5===p.children.length && 'A'===p.children[0].text && 'B'===p.children[1].text && 'C'===p.children[2].text && 'D'===p.children[3].text && 'E'===p.children[4].text)
        p.del()
//        a.t(null===ml.root.get('p'))
    })();

    // addRoot
    ;(function(){
        const p = ml.el.p({id:'test-p'}, 'test-p')
        ml.addRoot(p)
        a.t(p===ml.get('#test-p'))
        p.del()
        a.t(null===ml.get('#test-p'))

        ml.root.add(p)
        a.t(p===ml.get('#test-p'))
        p.del()
        a.t(null===ml.get('#test-p'))
    })();

    // get
    ;(function(){
        const p = ml.el.p(ml.el.span({id:'A'},'A'), ml.el.span({id:'B'},'B'), ml.el.span({id:'C'},'C'))
        ml.root.add(p)
        a.t(ml.get('#B')===document.querySelector('#B'))
        p.del()
    })();

    // gets
    ;(function(){
        const p = ml.el.p(ml.el.span({id:'A'},'A'), ml.el.span({id:'B'},'B'), ml.el.span({id:'C'},'C'))
        ml.root.add(p)
        const spans = ml.gets('span')
        a.t(3===spans.length &&'A'===spans[0].text &&'B'===spans[1].text &&'C'===spans[2].text)
        p.del()
        //console.log(ml.get('p'))
        //a.t(null===ml.get('p'))
    })();

    // getP  closest
    ;(function(){
        const i = ml.el.i({id:'id-i'})
        const p = ml.el.p(i, ml.el.span({id:'A'},'A'), ml.el.span({id:'B'},'B'), ml.el.span({id:'C'},'C'))
        const divC = ml.el.div({class:'class-div-c'})
        const divP = ml.el.div({class:'class-div-p'})
        p.add(i)
        divC.add(p)
        divP.add(divC)
        a.t(divP===i.closest('.class-div-p'))
        a.t(divP===ml.getP(i,'.class-div-p'))
        a.t(divP===i.getP('.class-div-p'))
    })();

    // set
    ;(function(){
        const p = ml.el.p({id:'id-p'})
        ml.root.add(p)
        a.t(p===ml.root.get('#id-p'))
        const ruby = ml.el.ruby({id:'id-ruby'})
        ml.set(p, ruby)
        a.t(null===ml.root.get('#id-p'))
        a.t(!!ml.root.get('#id-ruby'))
        p.del()
        ruby.del()
    })();

    // del
    ;(function(){
        const p = ml.el.p({id:'id-p'})
        ml.root.add(p)
        a.t(p===ml.root.get('#id-p'))
        p.del()
        a.t(null===ml.root.get('#id-p'))
    })();

    // getPath
    ;(function(){
        const i = ml.el.i({id:'id-i'})
        a.e(TypeError, `Element has no parent node. The element may not have been added to the document. Please do document.body.append(el).`, ()=>ml.getPath(i))
        ml.root.add(i)
        a.t('/html/i'===ml.getPath(i))
        i.del()
    })();

    // getX
    ;(function(){
        const p = ml.el.p({id:'id-p'})
        const i = ml.el.i({id:'id-i'})
        p.add(i)
        ml.root.add(p)
        console.log(i.xpath)
        console.log(ml.getX('/html/p/i'))
        a.t(i===ml.getX('/html/p/i'))

        let A = document.evaluate('/html/p/i', document, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null)
        let ans = [...Array(A.snapshotLength)].map((_,i)=>A.snapshotItem(i))
        console.log(ans)
        A = document.evaluate('//p/i', document.body, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null)
        ans = [...Array(A.snapshotLength)].map((_,i)=>A.snapshotItem(i))
        A = document.evaluate('//i', p, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null)
        ans = [...Array(A.snapshotLength)].map((_,i)=>A.snapshotItem(i))
        console.log(ans)
//        i.del()
//        p.del()
    })();

    // setX
    ;(function(){
        const p = ml.el.p({id:'id-p'})
        const i = ml.el.i({id:'id-i'})
        p.add(i)
        ml.root.add(p)
        console.log()
        a.t(i===ml.getX(i.xpath))
        const b = ml.el.b({id:'id-b'})
        ml.setX(i.xpath, b)
        a.t(b===ml.getX('/html/p/b'))
        i.del()
        b.del()
        p.del()
    })();

    // delX
    ;(function(){
        const p = ml.el.p({id:'id-p'})
        const i = ml.el.i({id:'id-i'})
        p.add(i)
        ml.root.add(p)
        console.log(i.xpath)
        a.t(i===ml.getX(i.xpath))
        ml.delX(i.xpath)
        //console.log(i.xpath)
        //console.log(ml.getX('/html/p[2]/i'))
        //console.log(ml.getX(''))
        a.e(DOMException, `Failed to execute 'evaluate' on 'Document': The string '' is not a valid XPath expression.`, ()=>ml.getX(''))
//        a.t(null===ml.getX('/html/p[2]/i'))
//        a.t(null===ml.getX(i.xpath))
        a.e(DOMException, `Failed to execute 'evaluate' on 'Document': The string '' is not a valid XPath expression.`, ()=>ml.getX(i.xpath))
        i.del()
        p.del()
    })();

    // on
    ;(function(){
        const i = ml.el.i('i-text')
        let v = null
        ml.on(i,'click',(e)=>v=e.target.textContent)
        ml.trigger(i,'click')
        a.t('i-text'===v)
    })();

    // off
    ;(function(){
        const i = ml.el.i('i-text')
        const evNm = 'click'
        const fn = (e)=>v=e.target.textContent
        // on
        let v = null
        ml.on(i,evNm,fn)
        ml.trigger(i,evNm)
        a.t('i-text'===v)
        // off
        v = null
        ml.off(i,evNm,fn)
        ml.trigger(i,evNm)
        a.t(null===v)
    })();

    // onStart
    ;(function(){
        console.log(ml.onStart)
        let v = null
        const onStart = ()=>v='onStart!!'
        ml.onStart = onStart
        a.t(onStart===ml.onStart)
        console.log(ml.onStart)
        console.log(window.events)
        console.log(window.events.map.keys())
        a.t(window.events.map.has('DOMContentLoaded'))
        a.t(1===window.events.map.get('DOMContentLoaded').length)
        a.t(onStart===window.events.map.get('DOMContentLoaded')[0][0])
        a.t(undefined===window.events.map.get('DOMContentLoaded')[0][1])
        // window.events['DOMContentLoaded']
        // window.events.map.get('DOMContentLoaded')
        console.log(window.events.obj)
//        console.log(window.events.obj._map)
//        console.log(window.events.obj[''])
        console.log(window.events.obj['DOMContentLoaded'])
        console.log(window.events.obj['DOMContentLoaded'][0])
        console.log(window.events.obj['DOMContentLoaded'][0][0])
//        console.log(window.events.obj['DOMContentLoaded']['DOMContentLoaded'])
//        console.log(window.events.obj['DOMContentLoaded']['DOMContentLoaded'][0])
//        console.log(window.events.obj['DOMContentLoaded']['DOMContentLoaded'][0][0])
        a.t(1===window.events.obj['DOMContentLoaded'].length)
        a.t(onStart===window.events.obj['DOMContentLoaded'][0][0])
        a.t(undefined===window.events.obj['DOMContentLoaded'][0][1])
        /*
        */
        // onStartは一つの関数のみ設定可能
        const onStart2 = ()=>v='onStart2'
        ml.onStart = onStart2
        a.t(window.events.map.has('DOMContentLoaded'))
        console.log(window.events.map.get('DOMContentLoaded').length)
        a.t(1===window.events.map.get('DOMContentLoaded').length)
        a.t(onStart2===window.events.map.get('DOMContentLoaded')[0][0])
        a.t(undefined===window.events.map.get('DOMContentLoaded')[0][1])
        // window.events['DOMContentLoaded']
        // window.events.map.get('DOMContentLoaded')
        a.t(1===window.events.obj['DOMContentLoaded'].length)
        console.log(window.events.obj['DOMContentLoaded'])
        a.t(onStart2===window.events.obj['DOMContentLoaded'][0][0])
        a.t(undefined===window.events.obj['DOMContentLoaded'][0][1])
        // map,obj共にset可
        window.events.map.get('DOMContentLoaded')[0][0] = onStart
        a.t(onStart===window.events.obj['DOMContentLoaded'][0][0])
        window.events.map.set('DOMContentLoaded', [[onStart2,undefined]])
        a.t(onStart2===window.events.obj['DOMContentLoaded'][0][0])
        window.events.obj['DOMContentLoaded'][0][0] = onStart
        a.t(onStart===window.events.obj['DOMContentLoaded'][0][0])
        window.events.obj['DOMContentLoaded'] = [[onStart2,undefined]] // 代入しても反映されない！
        a.t(onStart2===window.events.obj['DOMContentLoaded'][0][0])
    })();

    // onEnd
    ;(function(){
        let v = null
        const onEnd = ()=>v='onEnd!!'
        ml.onEnd = onEnd
        a.t(onEnd===ml.onEnd)
        a.t(window.events.map.has('beforeunload'))
        a.t(1===window.events.map.get('beforeunload').length)
        a.t(onEnd===window.events.map.get('beforeunload')[0][0])
        a.t(undefined===window.events.map.get('beforeunload')[0][1])
        // window.events['beforeunload']
        // window.events.map.get('beforeunload')
        a.t(1===window.events.obj['beforeunload'].length)
        a.t(onEnd===window.events.obj['beforeunload'][0][0])
        a.t(undefined===window.events.obj['beforeunload'][0][1])
        // onEndは一つの関数のみ設定可能
        const onEnd2 = ()=>v='onEnd2'
        ml.onEnd = onEnd2
        a.t(window.events.map.has('beforeunload'))
        a.t(1===window.events.map.get('beforeunload').length)
        a.t(onEnd2===window.events.map.get('beforeunload')[0][0])
        a.t(undefined===window.events.map.get('beforeunload')[0][1])
        // window.events['beforeunload']
        // window.events.map.get('beforeunload')
        a.t(1===window.events.obj['beforeunload'].length)
        a.t(onEnd2===window.events.obj['beforeunload'][0][0])
        a.t(undefined===window.events.obj['beforeunload'][0][1])
        // map,obj共にset可
        window.events.map.get('beforeunload')[0][0] = onEnd
        a.t(onEnd===window.events.obj['beforeunload'][0][0])
        window.events.map.set('beforeunload', [[onEnd2,undefined]])
        a.t(onEnd2===window.events.obj['beforeunload'][0][0])
        window.events.obj['beforeunload'][0][0] = onEnd
        a.t(onEnd===window.events.obj['beforeunload'][0][0])
        window.events.obj['beforeunload'] = [[onEnd2,undefined]] // 代入しても反映されない！
        a.t(onEnd2===window.events.obj['beforeunload'][0][0])
     })();

    // trigger
    ;(function(){
        const i = ml.el.i('i-text')
        const evNm = 'click'
        const fn = (e)=>v=e.target.textContent
        // on
        let v = null
        ml.on(i,evNm,fn)
        ml.trigger(i,evNm)
        a.t('i-text'===v)
        // off
        v = null
        ml.off(i,evNm,fn)
        ml.trigger(i,evNm)
        a.t(null===v)

        // CustomEvent（detail無）
        const myEv = new CustomEvent('myEvent')
        ml.on(i,'myEvent',fn)
        ml.trigger(i,'myEvent') // 名前で発火
        a.t('i-text'===v)
        v = null
        ml.trigger(i,myEv) // インスタンスで発火
        a.t('i-text'===v)

        // CustomEvent（detail有）
        const myEvD = new CustomEvent('myEventD',{detail:'some-value'})
        ml.on(i,'myEventD',fn)
        ml.trigger(i,'myEventD') // 名前で発火
        a.t('i-text'===v)
        v = null
        ml.trigger(i,myEvD) // インスタンスで発火
        a.t('i-text'===v)


    })();

    ;(function(){ // sheets
        a.t(document.styleSheets===css.sheets)
    })();
    ;(function(){ // cp
        console.log(css.cp.mainColor)
        a.t(''===css.cp.mainColor)
//        console.log(ml.root.style['--main-color'])
//        console.log(ml.root.style.getPropertyValue('--main-color'))
        a.t(undefined===ml.root.style['--main-color'])
        a.t(''===ml.root.style.getPropertyValue('--main-color'))
        css.cp.mainColor = 'red'
        a.t('red'===css.cp.mainColor)
        a.t(undefined===ml.root.style['--main-color'])
        a.t('red'===ml.root.style.getPropertyValue('--main-color'))
//        console.log(ml.root.style)
//        console.log(ml.root.style['--main-color'])
//        console.log(ml.root.style.getPropertyValue('--main-color'))
        css.cp.mainColor = null
        a.t(''===css.cp.mainColor)
        a.t(undefined===ml.root.style['--main-color'])
        a.t(''===ml.root.style.getPropertyValue('--main-color'))
    })();
    ;(function(){ // CP
        //console.log(css.CP.mainColor)
        a.t(''===css.CP.mainColor)
        a.t(undefined===ml.root.style['--main-color'])
        a.t(''===ml.root.style.getPropertyValue('--main-color'))
        a.e(TypeError, 'CPに値はセットできません。代わりにcpを使用してください。', ()=>css.CP.mainColor = 'red')
        css.cp.mainColor = 'red'
        a.t('red'===css.CP.mainColor)
        a.t(undefined===ml.root.style['--main-color'])
        a.t('red'===ml.root.style.getPropertyValue('--main-color'))
        css.cp.mainColor = null
        a.t(''===css.CP.mainColor)
        a.t(undefined===ml.root.style['--main-color'])
        a.t(''===ml.root.style.getPropertyValue('--main-color'))
    })();
    ;(function(){ // cp:inline, CP:css+inline
        const i = ml.el.i({id:'id-i'})
        const style = ml.el.style({id:'id-style'}, ':root{--main-color:red;}')
        a.t(''===css.cp.mainColor)
        a.t(''===css.CP.mainColor)
        a.t(undefined===ml.root.style['--main-color'])
        a.t(''===ml.root.style.getPropertyValue('--main-color'))
        a.t(''===getComputedStyle(ml.root).getPropertyValue('--main-color'))

        ml.root.add(i)
        a.t(''===css.cp.mainColor)
        a.t(''===css.CP.mainColor)
        a.t(undefined===ml.root.style['--main-color'])
        a.t(''===ml.root.style.getPropertyValue('--main-color'))
        a.t(''===getComputedStyle(ml.root).getPropertyValue('--main-color'))

        ml.root.add(style)
        a.t(''===css.cp.mainColor)
        a.t('red'===css.CP.mainColor)
        a.t(undefined===ml.root.style['--main-color'])
        a.t(''===ml.root.style.getPropertyValue('--main-color'))
        a.t('red'===getComputedStyle(ml.root).getPropertyValue('--main-color'))
        i.del()
    })();


    // EventListener add trigger
    ;(function(){
        const i = ml.el.i({id:'id-i'})
        a.t(Type.isIns(i.events))
        a.t(Type.isMap(i.events.map))
        a.t(i.events.map instanceof Map)
        a.t(0===i.events.map.size)

        let v = null
        const onClick = ()=>v='onClick!!'
        i.events.add('click', onClick)
        i.dispatchEvent(new Event('click'))
        a.t('onClick!!'===v)
        v = null
        i.trigger('click')
        a.t('onClick!!'===v)
        i.del()
    })();
    ;(function(){
        const i = ml.el.i({id:'id-i'})
        let v = null
        const onClick = ()=>v='onClick!!'
        i.events.add('click', onClick, {once:true})
        i.dispatchEvent(new Event('click'))
        a.t('onClick!!'===v)
        a.t(i.events.map.has('click')) // {once:true}な実行済みイベントでも保持し続けてしまう…
        v = null
        i.trigger('click') // {once:true}のため一回実行すると二度と実行されない
        a.t(null===v)
        console.log(i.events.map.has('click'))
        console.log(i.events.map)
        a.f(i.events.map.has('click')) // {once:true}な実行済みイベントは削除する
        i.del()
    })();
    ;(function(){
        const i = ml.el.i({id:'id-i'})
        let v = null
        const onClick = ()=>v='onClick!!'
        i.events.add('click', onClick, {once:true})
        i.trigger('click') // {once:true}のため一回実行すると二度と実行されない
        a.f(i.events.map.has('click')) // {once:true}な実行済みイベントは削除する
        a.t('onClick!!'===v)
        v = null
        i.trigger('click') // {once:true}のため一回実行すると二度と実行されない
        a.t(null===v)
        console.log(i.events.map.has('click'))
        console.log(i.events.map)
        a.f(i.events.map.has('click')) // {once:true}な実行済みイベントは削除する
        i.del()
    })();
    // EventListener map obj
    ;(function(){
        const i = ml.el.i()
        a.t(Type.isMap(i.events.map))
        a.t(Type.isObj(i.events.obj))
        a.t(0===i.events.map.size)
        a.t(0===[...Object.keys(i.events.obj)].length)

        const onClick = ()=>{}
        const opt = {once:true}
        i.events.add('click', onClick, opt)
        
        // map
        a.t(Type.isMap(i.events.map))
        a.t(Type.isAry(i.events.map.get('click')))
        a.t(1===i.events.map.get('click').length)
        a.t(Type.isAry(i.events.map.get('click')[0]))
        a.t(2===i.events.map.get('click')[0].length)
        a.t(onClick===i.events.map.get('click')[0][0])
        a.t(opt===i.events.map.get('click')[0][1])

        // obj
        a.t(Type.isObj(i.events.obj))
        a.t(Type.isAry(i.events.obj['click']))
        a.t(1===i.events.obj['click'].length)
        a.t(Type.isAry(i.events.obj['click'][0]))
        a.t(2===i.events.obj['click'][0].length)
        a.t(onClick===i.events.obj['click'][0][0])
        a.t(opt===i.events.obj['click'][0][1])

        const onClick2 = ()=>{}
        const opt2 = {once:false}
        i.events.add('click', onClick2, opt2)

        // map
        a.t(2===i.events.map.get('click').length)
        a.t(Type.isAry(i.events.map.get('click')[1]))
        a.t(2===i.events.map.get('click')[1].length)
        a.t(onClick2===i.events.map.get('click')[1][0])
        a.t(opt2===i.events.map.get('click')[1][1])

        // obj
        a.t(2===i.events.obj['click'].length)
        a.t(Type.isAry(i.events.obj['click'][1]))
        a.t(2===i.events.obj['click'][1].length)
        a.t(onClick2===i.events.obj['click'][1][0])
        a.t(opt2===i.events.obj['click'][1][1])

        // gets
        a.t(Type.isAry(i.events.gets('click')))
        a.t(2===i.events.gets('click').length)
        a.t(onClick===i.events.gets('click')[0][0])
        a.t(opt===i.events.gets('click')[0][1])
        a.t(onClick2===i.events.gets('click')[1][0])
        a.t(opt2===i.events.gets('click')[1][1])

        // get
        a.t(Type.isAry(i.events.get('click', onClick, opt)))
        a.t(2===i.events.get('click', onClick, opt).length)
        a.t(onClick===i.events.get('click', onClick, opt)[0])
        a.t(opt===i.events.get('click', onClick, opt)[1])

        a.t(Type.isAry(i.events.get('click', onClick2, opt2)))
        a.t(2===i.events.get('click', onClick2, opt2).length)
        a.t(onClick2===i.events.get('click', onClick2, opt2)[0])
        a.t(opt2===i.events.get('click', onClick2, opt2)[1])

        // getFirstFn
        a.t(onClick===i.events.getFirstFn('click'))

        i.del()
    })();
    // EventListener set
    ;(function(){
        const i = ml.el.i()
        const onClick = ()=>{}
        const opt = {once:true}
        i.events.add('click', onClick, opt)
        a.t(1===i.events.map.size)
        a.t(onClick===i.events.map.get('click')[0][0])
        a.t(opt===i.events.map.get('click')[0][1])

        const onClick2 = ()=>{}
        const opt2 = {once:false}
        i.events.set('click', [onClick, opt], [onClick2, opt2])
        a.t(1===i.events.map.size)
        a.t(onClick2===i.events.map.get('click')[0][0])
        a.t(opt2===i.events.map.get('click')[0][1])
        
    })();
    // EventListener del
    ;(function(){
        const i = ml.el.i()
        let v=null
        const onClick = ()=>v=1
        const optClick = {once:true}
        i.events.add('click', onClick, optClick)
        a.t(1===i.events.map.size)

        const onSelect = ()=>v=2
        const optSelect = {}
        i.events.add('select', onSelect, optSelect)
        a.t(2===i.events.map.size)

        i.events.del()
        a.t(0===i.events.map.size)
        i.trigger('click')
        i.trigger('select')
        a.t(null===v)

        i.events.add('click', onClick, optClick)
        i.events.add('select', onSelect, optSelect)
        i.events.del('click')
        a.t(1===i.events.map.size)
        a.t(i.events.map.has('select'))
        a.f(i.events.map.has('click'))

        i.events.del()
        a.t(0===i.events.map.size)

        i.events.add('click', onClick, optClick)
        i.events.add('click', ()=>v=11)
        i.events.add('click', ()=>v=111)
        i.events.add('click', ()=>v=1111)
        i.events.add('select', onSelect, optSelect)
        i.events.add('select', ()=>v=22)
        i.events.add('select', ()=>v=222)
        a.t(2===i.events.map.size)
        a.t(4===i.events.gets('click').length)
        a.t(3===i.events.gets('select').length)

        i.events.del('click', onClick, optClick)
        a.t(2===i.events.map.size)
        a.t(3===i.events.gets('click').length)
        a.t(3===i.events.gets('select').length)
        a.t(i.events.gets('click').every(([fn,opt])=>fn!==onClick && opt!==optClick))

        i.events.del('click')
        a.t(1===i.events.map.size)
        a.f(i.events.has('click'))
        a.t(undefined===i.events.gets('click'))
        a.t(3===i.events.gets('select').length)

        i.events.del()
        a.t(0===i.events.map.size)
        i.del()
    })();

    // EventListener clear
    ;(function(){
        const i = ml.el.i()
        let v=null
        i.events.add('click', ()=>v=1)
        i.events.add('click', ()=>v=11)
        i.events.add('select', ()=>v=2)
        i.events.add('select', ()=>v=22)
        i.events.add('change', ()=>v=3)
        i.events.add('change', ()=>v=33)
        a.t(3===i.events.map.size)
        i.events.clear()
        a.t(0===i.events.map.size)
        i.trigger('click')
        i.trigger('select')
        i.trigger('change')
        a.t(null===v)
        i.del()
    })();

    // EventListener on/off
    ;(function(){
        const i = ml.el.i()
        let v=0
        const on1 = ()=>++v
        const op1 = undefined

        i.events.on('click', on1, op1)
        i.trigger('click')
        a.t(1===v)
        i.trigger('click')
        a.t(2===v)
        a.t(1===i.events.map.size)

        i.events.off('click')
        i.trigger('click')
        a.t(2===v)
        a.t(0===i.events.map.size)

        i.events.on('click', on1, op1)
        i.trigger('click')
        a.t(3===v)
        a.t(1===i.events.map.size)

        const on2 = ()=>v*=2
        const op2 = undefined
        i.events.on('click', on2, op2)
        i.trigger('click')
        a.t(6===v)
        a.t(1===i.events.map.size)
        a.t(on2===i.events.gets('click')[0][0])
        a.t(on2===i.events.getFirstFn('click'))
        i.del()
    })();

    // CustomEvents 
    ;(function(){
        a.t(0===ml.events.size)
        ml.events.add('myEvent', {detail:'some-value'})
        a.t(1===ml.events.size)
        a.t(Type.isMap(ml.events.map))         
        a.t(Type.isObj(ml.events.obj))         
        a.t(ml.events.map.get('myEvent') instanceof Event)
        a.t(ml.events.map.get('myEvent') instanceof CustomEvent)
        a.t(ml.events.map.get('myEvent').type==='myEvent')
        a.t(ml.events.map.get('myEvent').detail==='some-value')
        a.t(ml.events.get('myEvent') instanceof Event)
        a.t(ml.events.get('myEvent') instanceof CustomEvent)
        a.t(ml.events.get('myEvent').type==='myEvent')
        a.t(ml.events.get('myEvent').detail==='some-value')
        a.t(ml.events.obj['myEvent'] instanceof Event)
        a.t(ml.events.obj['myEvent'] instanceof CustomEvent)
        a.t(ml.events.obj['myEvent'].type==='myEvent')
        a.t(ml.events.obj['myEvent'].detail==='some-value')

        const e1 = ml.events.new('someEvent', {detail:'some'})
        a.t(1===ml.events.size) // Mapに追加されない
        a.t(e1 instanceof CustomEvent)
        a.t(e1.type==='someEvent')
        a.t(e1.detail==='some')

        const e2 = ml.events.add('someEvent2', {detail:'some2'})
        a.t(2===ml.events.size) // Mapに追加される
        a.t(e2.type==='someEvent2')
        a.t(e2.detail==='some2')

        a.t(2===[...ml.events.keys].length)
        a.t('myEvent'===[...ml.events.keys][0])
        a.t('someEvent2'===[...ml.events.keys][1])

        a.t(2===[...ml.events.values].length)
        a.t('myEvent'===[...ml.events.values][0].type)
        a.t('someEvent2'===[...ml.events.values][1].type)

        a.t(2===[...ml.events.entries].length)
        a.t('myEvent'===[...ml.events.entries][0][0])
        a.t('someEvent2'===[...ml.events.entries][1][0])
        a.t('myEvent'===[...ml.events.entries][0][1].type)
        a.t('someEvent2'===[...ml.events.entries][1][1].type)

        ml.events.del('myEvent')
        a.t(1===ml.events.size)
        a.t(ml.events.obj['someEvent2'] instanceof CustomEvent)
        a.t(ml.events.obj['someEvent2'].type==='someEvent2')
        a.t(ml.events.obj['someEvent2'].detail==='some2')

        ml.events.add('someEvent3')
        a.t(2===ml.events.size)
        ml.events.clear()
        a.t(0===ml.events.size)
    })();
    a.fin()
})
